# Publishes the visual editor (with a freshly built interpreter) to GitHub
# Pages. One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: layer-go/go.mod
          cache-dependency-path: layer-go/go.mod

      - name: Build the interpreter to WebAssembly
        working-directory: layer-go
        run: ./build-wasm.sh

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: visual-editor/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: visual-editor/frontend/pnpm-lock.yaml

      - name: Build the editor
        working-directory: visual-editor/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: visual-editor/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
