# Publishes the visual editor (with a freshly built interpreter) to GitHub
# Pages, then runs the browser tests against the deployed site.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: layer-go/go.mod
          cache-dependency-path: layer-go/go.mod

      - name: Build the interpreter to WebAssembly
        working-directory: layer-go
        run: ./build-wasm.sh

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: visual-editor/frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: visual-editor/frontend/pnpm-lock.yaml

      - name: Build the editor
        working-directory: visual-editor/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: visual-editor/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Browser tests on the deployed site
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-editor/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: visual-editor/frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: visual-editor/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: visual-editor/frontend/playwright-report
          if-no-files-found: ignore
