name: CI

on:
  push:
  pull_request:

jobs:
  interpreter:
    name: Interpreter (Go + WebAssembly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: layer-go/go.mod
          cache-dependency-path: layer-go/go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi

      - name: go vet (native and wasm)
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./cmd/wasm ./pkg/...

      # Includes every examples/*.layer program and every complete program in README.md.
      - name: go test
        run: go test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: WebAssembly smoke test
        run: ./build-wasm.sh && node test_wasm_node.js

  editor:
    name: Visual editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-editor/frontend
    steps:
      - uses: actions/checkout@v7

      # Test the editor against the interpreter in this commit, not the
      # committed public/layer.wasm.
      - uses: actions/setup-go@v7
        with:
          go-version-file: layer-go/go.mod
          cache-dependency-path: layer-go/go.mod
      - name: Build the interpreter to WebAssembly
        working-directory: layer-go
        run: ./build-wasm.sh

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: visual-editor/frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: visual-editor/frontend/pnpm-lock.yaml

      - name: Blend-mode animations match their generator
        working-directory: .
        run: |
          node docs/images/blend/generate.mjs
          git diff --exit-code -- docs/images/blend || (echo "Run: node docs/images/blend/generate.mjs" && exit 1)

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: visual-editor/frontend/playwright-report
          if-no-files-found: ignore
