<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 336" width="700" height="336" role="img" aria-labelledby="t d">
<title id="t">Layer blend mode: override</title>
<desc id="d">A call to greet goes to the top layer, friendly, which answers &quot;Hi Ada!&quot;. The definitions in formal and core are shadowed, but a layer can still call them explicitly, e.g. core.greet(n).</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#24292f}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.title{font-size:20px;font-weight:700}
.subtitle{font-size:13px;fill:#57606a}
.directive{font-size:12px;fill:#8250df}
.label{font-size:10px;font-weight:600;letter-spacing:.08em;fill:#8c959f}
.pill{font-size:12px}
.name{font-size:13px;font-weight:600}
.def{font-size:11.5px;fill:#57606a}
.tag{font-size:11px;font-weight:600}
.result{font-size:12px;fill:#0550ae}
.caption{font-size:13.5px}
.note{font-size:11px;fill:#8c959f}
@keyframes override0{0%{opacity:0}15.00%{opacity:0}17.50%{opacity:1}29.50%{opacity:1}32.00%{opacity:0}100%{opacity:0}}
@keyframes override1{0%{opacity:0}30.00%{opacity:0}32.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes override2{0%{opacity:0}37.00%{opacity:0}39.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes override3{0%{opacity:0}40.00%{opacity:0}42.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes override4{0%{opacity:0}36.00%{opacity:0}38.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes override5{0%{opacity:0;transform:translate(194px,127px)}4.50%{opacity:0;transform:translate(194px,127px)}5.00%{opacity:1;transform:translate(194px,127px)}15.00%{opacity:1;transform:translate(238px,127px)}30.00%{opacity:1;transform:translate(502px,127px)}36.00%{opacity:1;transform:translate(528px,127px)}38.50%{opacity:0;transform:translate(528px,127px)}100%{opacity:0;transform:translate(528px,127px)}}
@keyframes override6{0%{opacity:0}2.00%{opacity:0}4.50%{opacity:1}14.50%{opacity:1}17.00%{opacity:0}100%{opacity:0}}
@keyframes override7{0%{opacity:0}17.00%{opacity:0}19.50%{opacity:1}34.50%{opacity:1}37.00%{opacity:0}100%{opacity:0}}
@keyframes override8{0%{opacity:0}37.00%{opacity:0}39.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="699" height="335" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" class="title">override</text>
<text x="24" y="60" class="subtitle">The top definition answers; the ones below are shadowed.</text>
<text x="24" y="86" class="mono directive">@layers [core, formal, friendly]          # blend: override is the default</text>
<text x="24" y="108" class="label">CALL</text>
<rect x="24" y="114" width="170" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="109" y="131" text-anchor="middle" class="mono pill">greet(&quot;Ada&quot;)</text>
<text x="528" y="108" class="label">RESULT</text>
<rect x="230" y="104" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="104" width="280" height="46" rx="8" fill="#e91e63" fill-opacity="0.12" stroke="#e91e63" stroke-width="2" opacity="0" style="animation:override0 10s linear infinite" class="a"/>
<rect x="230" y="104" width="6" height="46" rx="3" fill="#e91e63"/>
<text x="246" y="122" class="name">friendly</text>
<text x="246" y="140" class="mono def">fn greet(n) = &quot;Hi {n}!&quot;</text>
<g opacity="1" style="animation:override1 10s linear infinite" class="a"><rect x="439" y="110" width="61" height="17" rx="8.5" fill="#dafbe1"/><text x="469.5" y="122.5" text-anchor="middle" class="tag" fill="#116329">answers</text></g>
<rect x="230" y="164" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="164" width="6" height="46" rx="3" fill="#3f51b5"/>
<text x="246" y="182" class="name">formal</text>
<text x="246" y="200" class="mono def">fn greet(n) = &quot;Good day, {n}.&quot;</text>
<g opacity="1" style="animation:override2 10s linear infinite" class="a"><rect x="433" y="170" width="67" height="17" rx="8.5" fill="#eaeef2"/><text x="466.5" y="182.5" text-anchor="middle" class="tag" fill="#57606a">shadowed</text></g>
<rect x="230" y="224" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="224" width="6" height="46" rx="3" fill="#4caf50"/>
<text x="246" y="242" class="name">core</text>
<text x="246" y="260" class="mono def">fn greet(n) = &quot;Hello {n}&quot;</text>
<g opacity="1" style="animation:override3 10s linear infinite" class="a"><rect x="433" y="230" width="67" height="17" rx="8.5" fill="#eaeef2"/><text x="466.5" y="242.5" text-anchor="middle" class="tag" fill="#57606a">shadowed</text></g>
<g opacity="1" style="animation:override4 10s linear infinite" class="a"><rect x="528" y="114" width="160" height="26" rx="13" fill="#ddf4ff" stroke="#0969da"/><text x="608" y="131" text-anchor="middle" class="mono result">&quot;Hi Ada!&quot;</text></g>
<g opacity="0" style="animation:override5 10s linear infinite" class="a"><circle r="11" fill="#0969da" fill-opacity="0.18"/><circle r="5.5" fill="#0969da"/></g>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="0" style="animation:override6 10s linear infinite">A call to greet enters at the top of the stack.</text>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="0" style="animation:override7 10s linear infinite">friendly defines greet, so friendly answers.</text>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="1" style="animation:override8 10s linear infinite">formal and core are shadowed — a layer can still call core.greet(n) explicitly.</text>
</svg>
