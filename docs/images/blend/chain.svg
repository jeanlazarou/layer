<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 336" width="700" height="336" role="img" aria-labelledby="t d">
<title id="t">Layer blend mode: chain</title>
<desc id="d">core.total runs first with the original arguments and returns 30; discount receives 30 and returns 25; tax receives 25 and returns 31.25, which is the result.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#24292f}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.title{font-size:20px;font-weight:700}
.subtitle{font-size:13px;fill:#57606a}
.directive{font-size:12px;fill:#8250df}
.label{font-size:10px;font-weight:600;letter-spacing:.08em;fill:#8c959f}
.pill{font-size:12px}
.name{font-size:13px;font-weight:600}
.def{font-size:11.5px;fill:#57606a}
.tag{font-size:11px;font-weight:600}
.result{font-size:12px;fill:#0550ae}
.caption{font-size:13.5px}
.note{font-size:11px;fill:#8c959f}
@keyframes chain0{0%{opacity:0}53.00%{opacity:0}55.50%{opacity:1}61.50%{opacity:1}64.00%{opacity:0}100%{opacity:0}}
@keyframes chain1{0%{opacity:0}61.00%{opacity:0}63.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes chain2{0%{opacity:0}36.00%{opacity:0}38.50%{opacity:1}44.50%{opacity:1}47.00%{opacity:0}100%{opacity:0}}
@keyframes chain3{0%{opacity:0}45.00%{opacity:0}47.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes chain4{0%{opacity:0}18.00%{opacity:0}20.50%{opacity:1}27.50%{opacity:1}30.00%{opacity:0}100%{opacity:0}}
@keyframes chain5{0%{opacity:0}28.00%{opacity:0}30.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes chain6{0%{opacity:0}66.00%{opacity:0}68.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes chain7{0%{opacity:0;transform:translate(194px,127px)}4.50%{opacity:0;transform:translate(194px,127px)}5.00%{opacity:1;transform:translate(194px,127px)}8.00%{opacity:1;transform:translate(214px,127px)}16.00%{opacity:1;transform:translate(214px,247px)}18.00%{opacity:1;transform:translate(238px,247px)}28.00%{opacity:1;transform:translate(502px,247px)}30.50%{opacity:1;transform:translate(518px,247px)}34.50%{opacity:1;transform:translate(518px,187px)}36.00%{opacity:1;transform:translate(502px,187px)}45.00%{opacity:1;transform:translate(238px,187px)}47.00%{opacity:1;transform:translate(214px,187px)}51.00%{opacity:1;transform:translate(214px,127px)}53.00%{opacity:1;transform:translate(238px,127px)}61.00%{opacity:1;transform:translate(502px,127px)}66.00%{opacity:1;transform:translate(528px,127px)}68.50%{opacity:0;transform:translate(528px,127px)}100%{opacity:0;transform:translate(528px,127px)}}
@keyframes chain8{0%{opacity:0}2.00%{opacity:0}4.50%{opacity:1}27.50%{opacity:1}30.00%{opacity:0}100%{opacity:0}}
@keyframes chain9{0%{opacity:0}30.00%{opacity:0}32.50%{opacity:1}61.50%{opacity:1}64.00%{opacity:0}100%{opacity:0}}
@keyframes chain10{0%{opacity:0}64.00%{opacity:0}66.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="699" height="335" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" class="title">chain</text>
<text x="24" y="60" class="subtitle">The bottom layer runs first; each layer above transforms the previous result.</text>
<text x="24" y="86" class="mono directive">@layers [core, discount, tax] blend: chain</text>
<text x="24" y="108" class="label">CALL</text>
<rect x="24" y="114" width="170" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="109" y="131" text-anchor="middle" class="mono pill">total([10, 20])</text>
<text x="528" y="108" class="label">RESULT</text>
<rect x="230" y="104" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="104" width="280" height="46" rx="8" fill="#ff9800" fill-opacity="0.12" stroke="#ff9800" stroke-width="2" opacity="0" style="animation:chain0 10s linear infinite" class="a"/>
<rect x="230" y="104" width="6" height="46" rx="3" fill="#ff9800"/>
<text x="246" y="122" class="name">tax</text>
<text x="246" y="140" class="mono def">fn total(x) = x * 1.25</text>
<g opacity="1" style="animation:chain1 10s linear infinite" class="a"><rect x="439" y="110" width="61" height="17" rx="8.5" fill="#ddf4ff"/><text x="469.5" y="122.5" text-anchor="middle" class="tag" fill="#0969da">→ 31.25</text></g>
<rect x="230" y="164" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="164" width="280" height="46" rx="8" fill="#009688" fill-opacity="0.12" stroke="#009688" stroke-width="2" opacity="0" style="animation:chain2 10s linear infinite" class="a"/>
<rect x="230" y="164" width="6" height="46" rx="3" fill="#009688"/>
<text x="246" y="182" class="name">discount</text>
<text x="246" y="200" class="mono def">fn total(x) = x - 5</text>
<g opacity="1" style="animation:chain3 10s linear infinite" class="a"><rect x="458" y="170" width="42" height="17" rx="8.5" fill="#ddf4ff"/><text x="479" y="182.5" text-anchor="middle" class="tag" fill="#0969da">→ 25</text></g>
<rect x="230" y="224" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="224" width="280" height="46" rx="8" fill="#4caf50" fill-opacity="0.12" stroke="#4caf50" stroke-width="2" opacity="0" style="animation:chain4 10s linear infinite" class="a"/>
<rect x="230" y="224" width="6" height="46" rx="3" fill="#4caf50"/>
<text x="246" y="242" class="name">core</text>
<text x="246" y="260" class="mono def">fn total(items) = sum(items)</text>
<g opacity="1" style="animation:chain5 10s linear infinite" class="a"><rect x="458" y="230" width="42" height="17" rx="8.5" fill="#ddf4ff"/><text x="479" y="242.5" text-anchor="middle" class="tag" fill="#0969da">→ 30</text></g>
<g opacity="1" style="animation:chain6 10s linear infinite" class="a"><rect x="528" y="114" width="160" height="26" rx="13" fill="#ddf4ff" stroke="#0969da"/><text x="608" y="131" text-anchor="middle" class="mono result">31.25</text></g>
<g opacity="0" style="animation:chain7 10s linear infinite" class="a"><circle r="11" fill="#0969da" fill-opacity="0.18"/><circle r="5.5" fill="#0969da"/></g>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="0" style="animation:chain8 10s linear infinite">chain starts at the bottom: core.total gets the original arguments → 30.</text>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="0" style="animation:chain9 10s linear infinite">Each layer above receives the previous result as its first argument.</text>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="1" style="animation:chain10 10s linear infinite">The top layer's result is the answer: 30 → 25 → 31.25.</text>
</svg>
