<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 336" width="700" height="336" role="img" aria-labelledby="t d">
<title id="t">Layer blend mode: collect</title>
<desc id="d">console, audit and core all run notify(&quot;login&quot;), top of the stack first, and the result is the list [&quot;console: login&quot;, &quot;audit: login&quot;, &quot;core: login&quot;].</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#24292f}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.title{font-size:20px;font-weight:700}
.subtitle{font-size:13px;fill:#57606a}
.directive{font-size:12px;fill:#8250df}
.label{font-size:10px;font-weight:600;letter-spacing:.08em;fill:#8c959f}
.pill{font-size:12px}
.name{font-size:13px;font-weight:600}
.def{font-size:11.5px;fill:#57606a}
.tag{font-size:11px;font-weight:600}
.result{font-size:12px;fill:#0550ae}
.caption{font-size:13.5px}
.note{font-size:11px;fill:#8c959f}
@keyframes collect0{0%{opacity:0}13.00%{opacity:0}15.50%{opacity:1}21.50%{opacity:1}24.00%{opacity:0}100%{opacity:0}}
@keyframes collect1{0%{opacity:0}22.00%{opacity:0}24.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes collect2{0%{opacity:0}30.00%{opacity:0}32.50%{opacity:1}37.50%{opacity:1}40.00%{opacity:0}100%{opacity:0}}
@keyframes collect3{0%{opacity:0}38.00%{opacity:0}40.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes collect4{0%{opacity:0}46.00%{opacity:0}48.50%{opacity:1}53.50%{opacity:1}56.00%{opacity:0}100%{opacity:0}}
@keyframes collect5{0%{opacity:0}54.00%{opacity:0}56.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes collect6{0%{opacity:0}23.00%{opacity:0}25.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes collect7{0%{opacity:0}23.00%{opacity:0}25.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes collect8{0%{opacity:0}39.00%{opacity:0}41.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes collect9{0%{opacity:0}55.00%{opacity:0}57.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@keyframes collect10{0%{opacity:0;transform:translate(194px,127px)}4.50%{opacity:0;transform:translate(194px,127px)}5.00%{opacity:1;transform:translate(194px,127px)}13.00%{opacity:1;transform:translate(238px,127px)}22.00%{opacity:1;transform:translate(502px,127px)}24.50%{opacity:1;transform:translate(518px,127px)}28.50%{opacity:1;transform:translate(518px,187px)}30.00%{opacity:1;transform:translate(502px,187px)}38.00%{opacity:1;transform:translate(238px,187px)}40.00%{opacity:1;transform:translate(214px,187px)}44.00%{opacity:1;transform:translate(214px,247px)}46.00%{opacity:1;transform:translate(238px,247px)}54.00%{opacity:1;transform:translate(502px,247px)}56.50%{opacity:0;transform:translate(502px,247px)}100%{opacity:0;transform:translate(502px,247px)}}
@keyframes collect11{0%{opacity:0}2.00%{opacity:0}4.50%{opacity:1}21.50%{opacity:1}24.00%{opacity:0}100%{opacity:0}}
@keyframes collect12{0%{opacity:0}24.00%{opacity:0}26.50%{opacity:1}54.50%{opacity:1}57.00%{opacity:0}100%{opacity:0}}
@keyframes collect13{0%{opacity:0}57.00%{opacity:0}59.50%{opacity:1}91.50%{opacity:1}94.00%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="699" height="335" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="38" class="title">collect</text>
<text x="24" y="60" class="subtitle">Every layer that defines the function runs; the answer is the list of results.</text>
<text x="24" y="86" class="mono directive">@layers [core, audit, console] blend: collect</text>
<text x="24" y="108" class="label">CALL</text>
<rect x="24" y="114" width="170" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="109" y="131" text-anchor="middle" class="mono pill">notify(&quot;login&quot;)</text>
<text x="528" y="108" class="label">RESULT</text>
<rect x="230" y="104" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="104" width="280" height="46" rx="8" fill="#3f51b5" fill-opacity="0.12" stroke="#3f51b5" stroke-width="2" opacity="0" style="animation:collect0 10s linear infinite" class="a"/>
<rect x="230" y="104" width="6" height="46" rx="3" fill="#3f51b5"/>
<text x="246" y="122" class="name">console</text>
<text x="246" y="140" class="mono def">fn notify(e) = &quot;console: {e}&quot;</text>
<g opacity="1" style="animation:collect1 10s linear infinite" class="a"><rect x="465" y="110" width="35" height="17" rx="8.5" fill="#dafbe1"/><text x="482.5" y="122.5" text-anchor="middle" class="tag" fill="#116329">ran</text></g>
<rect x="230" y="164" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="164" width="280" height="46" rx="8" fill="#795548" fill-opacity="0.12" stroke="#795548" stroke-width="2" opacity="0" style="animation:collect2 10s linear infinite" class="a"/>
<rect x="230" y="164" width="6" height="46" rx="3" fill="#795548"/>
<text x="246" y="182" class="name">audit</text>
<text x="246" y="200" class="mono def">fn notify(e) = &quot;audit: {e}&quot;</text>
<g opacity="1" style="animation:collect3 10s linear infinite" class="a"><rect x="465" y="170" width="35" height="17" rx="8.5" fill="#dafbe1"/><text x="482.5" y="182.5" text-anchor="middle" class="tag" fill="#116329">ran</text></g>
<rect x="230" y="224" width="280" height="46" rx="8" fill="#fff" stroke="#d0d7de"/>
<rect x="230" y="224" width="280" height="46" rx="8" fill="#4caf50" fill-opacity="0.12" stroke="#4caf50" stroke-width="2" opacity="0" style="animation:collect4 10s linear infinite" class="a"/>
<rect x="230" y="224" width="6" height="46" rx="3" fill="#4caf50"/>
<text x="246" y="242" class="name">core</text>
<text x="246" y="260" class="mono def">fn notify(e) = &quot;core: {e}&quot;</text>
<g opacity="1" style="animation:collect5 10s linear infinite" class="a"><rect x="465" y="230" width="35" height="17" rx="8.5" fill="#dafbe1"/><text x="482.5" y="242.5" text-anchor="middle" class="tag" fill="#116329">ran</text></g>
<g opacity="1" style="animation:collect6 10s linear infinite" class="a"><rect x="528" y="114" width="160" height="62" rx="8" fill="#ddf4ff" stroke="#0969da"/></g>
<text x="538" y="131" class="mono result" opacity="1" style="animation:collect7 10s linear infinite">[&quot;console: login&quot;,</text>
<text x="538" y="147" class="mono result" opacity="1" style="animation:collect8 10s linear infinite"> &quot;audit: login&quot;,</text>
<text x="538" y="163" class="mono result" opacity="1" style="animation:collect9 10s linear infinite"> &quot;core: login&quot;]</text>
<g opacity="0" style="animation:collect10 10s linear infinite" class="a"><circle r="11" fill="#0969da" fill-opacity="0.18"/><circle r="5.5" fill="#0969da"/></g>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="0" style="animation:collect11 10s linear infinite">collect calls every layer that defines notify, top of the stack first…</text>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="0" style="animation:collect12 10s linear infinite">…and keeps each result.</text>
<text x="350" y="316" text-anchor="middle" class="caption" opacity="1" style="animation:collect13 10s linear infinite">The answer is the list of all the results.</text>
</svg>
